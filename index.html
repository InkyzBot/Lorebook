<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Janitor AI Lorebook Editor</title>
  <style>
    * { box-sizing: border-box; }
    body { 
      font-family: system-ui, -apple-system, sans-serif; 
      background-color: #1a1b26; /* Tema gelap ala terminal editor */
      color: #a9b1d6; 
      max-width: 650px; 
      margin: 0 auto; 
      padding: 20px; 
      line-height: 1.6;
    }
    h2, h3 { color: #7aa2f7; }
    
    .card { 
      background: #24283b; 
      padding: 20px; 
      border-radius: 8px; 
      border: 1px solid #414868;
      margin-bottom: 25px; 
    }
    .input-group { 
      margin-bottom: 15px; 
      display: flex; 
      flex-direction: column; 
    }
    label { 
      font-weight: 600; 
      margin-bottom: 5px; 
      font-size: 14px;
      color: #9ece6a;
    }
    input, textarea { 
      padding: 10px; 
      background: #1f2335;
      border: 1px solid #565f89; 
      color: #c0caf5;
      border-radius: 4px; 
      font-family: monospace; 
      font-size: 14px;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #7aa2f7;
    }
    
    button { 
      padding: 10px 15px; 
      cursor: pointer; 
      border: none; 
      border-radius: 4px; 
      font-weight: bold; 
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.8; }
    
    .btn-add { background: #7aa2f7; color: #1a1b26; width: 100%; }
    .btn-export { 
      background: #9ece6a; 
      color: #1a1b26; 
      width: 100%; 
      font-size: 16px; 
      margin-top: 10px; 
      padding: 15px;
    }
    .btn-delete { background: #f7768e; color: #1a1b26; padding: 6px 12px; margin-top: 10px; font-size: 12px; }
    
    ul { list-style: none; padding: 0; }
    li { 
      background: #24283b; 
      padding: 15px; 
      margin-bottom: 15px; 
      border-left: 5px solid #bb9af7; 
      border-radius: 4px; 
      border: 1px solid #414868;
    }
    .entry-data { margin-bottom: 8px; }
    .highlight { color: #e0af68; }
  </style>
</head>
<body>

  <h2>Editor Lorebook (Format Janitor AI)</h2>

  <div class="card">
    <div class="input-group">
      <label for="name">Nama Entri (Opsional):</label>
      <input type="text" id="name" placeholder="misal: Konsep Sihir">
    </div>

    <div class="input-group">
      <label for="keywords">Kata Kunci (pisahkan dengan koma):</label>
      <input type="text" id="keywords" placeholder="misal: Pain, Sakit, Luka">
    </div>

    <div class="input-group">
      <label for="content">Isi Teks Narasi:</label>
      <textarea id="content" rows="4" placeholder="Masukkan deskripsi di sini..."></textarea>
    </div>

    <button class="btn-add" onclick="addEntry()">Tambah Entri</button>
  </div>

  <h3>Daftar Entri (<span id="entryCount">0</span>)</h3>
  <div id="emptyMessage">Belum ada entri yang ditambahkan.</div>
  <ul id="entryList"></ul>

  <button class="btn-export" onclick="exportAndCopy()">
    📋 Salin Format Lorebook ke Clipboard
  </button>

  <script>
    let entries = [];

    // Fungsi untuk membuat UUID v4 agar ID setiap entri unik dan valid
    function generateUUID() {
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
        var r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
      });
    }

    function addEntry() {
      const nameInput = document.getElementById('name').value.trim();
      const keywordsInput = document.getElementById('keywords').value.trim();
      const contentInput = document.getElementById('content').value.trim();

      if (!keywordsInput || !contentInput) {
        alert("Kata kunci dan isi teks tidak boleh kosong!");
        return;
      }

      // Format kata kunci menjadi array
      const keywordArray = keywordsInput.split(',').map(k => k.trim()).filter(k => k.length > 0);
      
      // Menggunakan input asli untuk properti string mentah
      const rawKeywords = keywordArray.join(', ');

      // Menyusun objek dengan schema persis seperti Janitor AI
      const newEntry = {
        "activationMode": "standard",
        "activationScript": "",
        "case_sensitive": false,
        "category": "general",
        "comment": "",
        "constant": false,
        "content": contentInput,
        "enabled": true,
        "extensions": {},
        "groupWeight": 100,
        "id": generateUUID(), // Menghasilkan ID unik
        "inclusionGroupRaw": "",
        "insertion_order": 100,
        "key": keywordArray,
        "keyMatchPriority": false,
        "keysecondary": [],
        "keysecondaryRaw": "",
        "keysRaw": rawKeywords,
        "matchWholeWords": true,
        "minMessages": 0,
        "name": nameInput,
        "prioritizeInclusion": false,
        "priority": 1,
        "probability": 100,
        "selectiveLogic": 0,
        "tags": ["character", "lore", "faction", "magic", "backstory", "world"],
        "keywordsRaw": rawKeywords
      };

      entries.push(newEntry);
      
      // Kosongkan form
      document.getElementById('name').value = "";
      document.getElementById('keywords').value = "";
      document.getElementById('content').value = "";

      renderEntries();
    }

    function removeEntry(index) {
      entries.splice(index, 1);
      renderEntries();
    }

    function renderEntries() {
      const entryList = document.getElementById('entryList');
      const emptyMessage = document.getElementById('emptyMessage');
      const entryCount = document.getElementById('entryCount');

      entryCount.innerText = entries.length;
      emptyMessage.style.display = entries.length === 0 ? "block" : "none";
      
      entryList.innerHTML = "";
      entries.forEach((entry, index) => {
        const li = document.createElement('li');
        const displayName = entry.name ? `<strong>${entry.name}</strong><br>` : '';
        li.innerHTML = `
          <div class="entry-data">
            ${displayName}
            <span class="highlight">Keywords:</span> ${entry.key.join(', ')}
          </div>
          <div class="entry-data">
            <span class="highlight">Content:</span> ${entry.content}
          </div>
          <button class="btn-delete" onclick="removeEntry(${index})">Hapus Entri</button>
        `;
        entryList.appendChild(li);
      });
    }

    function exportAndCopy() {
      if (entries.length === 0) {
        alert("Belum ada entri untuk diekspor.");
        return;
      }

      const jsonString = JSON.stringify(entries, null, 2);
      
      navigator.clipboard.writeText(jsonString)
        .then(() => alert("Berhasil! JSON sudah disalin dengan format bawaan Janitor AI."))
        .catch(err => {
          console.error("Error: ", err);
          alert("Gagal menyalin teks.");
        });
    }
  </script>

</body>
</html>
